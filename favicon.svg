<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  The mark, as supplied, with one addition: it is drawn dark on a LIGHT tab
  strip and light on a dark one.

  The source artwork is filled pure white, which is right on this site and
  invisible in a browser tab in light mode — a white shape on a white tab. An
  SVG favicon is a live document, so it can answer the question itself;
  `prefers-color-scheme` inside the file is honoured by Chrome and Firefox, and
  a browser that ignores it falls back to the PNG below, which is white on
  black and legible either way.
-->
<style>
  path { fill: #ffffff; }
  @media (prefers-color-scheme: light) { path { fill: #0a0a0a; } }
</style>
